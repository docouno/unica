{
  "services": {
    "playground": {
      "image": "${DEVKIT_NODE_IMAGE:?}",
      "init": true,
      "user": "${DEVKIT_UID:?}:${DEVKIT_GID:?}",
      "working_dir": "/workspace/apps/playground",
      "command": [
        "npm",
        "run",
        "dev"
      ],
      "environment": {
        "HOME": "/tmp/devkit-home",
        "NPM_CONFIG_UPDATE_NOTIFIER": "false"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}",
          "target": "/workspace",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/node_modules",
          "target": "/workspace/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/apps/playground/node_modules",
          "target": "/workspace/apps/playground/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/apps/playground/dist",
          "target": "/workspace/apps/playground/dist",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/node_modules",
          "target": "/workspace/packages/ui/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/dist",
          "target": "/workspace/packages/ui/dist",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/release",
          "target": "/workspace/packages/ui/release",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        }
      ],
      "ports": [
        "127.0.0.1::5173"
      ]
    }
  }
}
