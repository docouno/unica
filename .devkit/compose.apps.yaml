{
  "services": {
    "playground": {
      "image": "${DEVKIT_NODE_IMAGE:?}",
      "init": true,
      "user": "${DEVKIT_UID:?}:${DEVKIT_GID:?}",
      "working_dir": "/workspace/apps/playground",
      "command": [
        "/devkit/bin/pnpm",
        "run",
        "dev"
      ],
      "environment": {
        "HOME": "/tmp/devkit-home",
        "NPM_CONFIG_UPDATE_NOTIFIER": "false",
        "PATH": "/devkit/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
        "XDG_CACHE_HOME": "/tmp/devkit-xdg-cache",
        "NPM_CONFIG_CACHE": "/tmp/devkit-npm-cache",
        "PNPM_CONFIG_PM_ON_FAIL": "ignore",
        "PNPM_CONFIG_RUNTIME": "false",
        "PNPM_CONFIG_RUNTIME_ON_FAIL": "ignore",
        "PNPM_CONFIG_IGNORE_PNPMFILE": "true"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}",
          "target": "/workspace",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/node_modules",
          "target": "/workspace/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/apps/playground/node_modules",
          "target": "/workspace/apps/playground/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/apps/playground/dist",
          "target": "/workspace/apps/playground/dist",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/node_modules",
          "target": "/workspace/packages/ui/node_modules",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/dist",
          "target": "/workspace/packages/ui/dist",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PROJECT_ROOT:?}/packages/ui/release",
          "target": "/workspace/packages/ui/release",
          "read_only": false,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${DEVKIT_PNPM_PATH:?}",
          "target": "/devkit/bin/pnpm",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        }
      ],
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "ports": [
        "127.0.0.1:${DEVKIT_PORT_PLAYGROUND:-0}:5173"
      ]
    }
  }
}
